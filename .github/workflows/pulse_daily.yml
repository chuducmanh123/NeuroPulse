name: Daily NeuroPulse Journal Aggregator

on:
  schedule:
    # Chạy lúc 05:00 sáng giờ VN (22:00 UTC) - Sau khi các tạp chí Mỹ (AAN, NEJM, JAMA, Stroke) hoàn tất xuất bản (21:00–21:30 UTC) và cách Guide 2 tiếng
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Articles (NeuroPulse)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_nejm.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "Pulse-Bot"
          git config --global user.email "bot@neuropulse.org"
          git add public/data/articles.json data/guidelines_store/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-update NeuroPulse latest journal articles"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "Không có bài báo mới."
          fi
